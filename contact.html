<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | My Portfolio</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="site-header">
        <nav class="navbar">

            <a href="index.html" class="logo">
                MyPortfolio.
            </a>

            <button class="menu-toggle"
                    aria-label="Toggle navigation"
                    aria-expanded="false">
                Menu
            </button>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </div>

        </nav>
    </header>

    <main>

        <section class="page-intro">
            <h1>Contact Me</h1>

            <p>
                Have a question or want
                to connect? Feel free
                to send me a message.
            </p>
        </section>

        <section class="content-section">

            <h2>Send a Message</h2>

            <form id="contact-form">

                <label for="name">
                    Your Name
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       required>

                <label for="email">
                    Your Email
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       required>

                <label for="message">
                    Your Message
                </label>

                <textarea id="message"
                          name="message"
                          rows="5"
                          required></textarea>

                <button type="submit"
                        class="button">
                    Send Message
                </button>

                <p id="form-status"
                   role="status"></p>

            </form>

        </section>

    </main>

    <footer class="site-footer">
        <p>
            &copy; <span class="current-year">2026</span>
            Your Name. All rights reserved.
        </p>
    </footer>

</body>
</html>
